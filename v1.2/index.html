<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Rắn Săn Mồi v1.2 Pro Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MÀN HÌNH MENU CÀI ĐẶT -->
  <div id="menu-screen" class="container">
    <h1>🐍 Rắn Săn Mồi v1.2 Pro</h1>
    <p class="subtitle">Thử thách phản xạ & Bản đồ độc đáo</p>

    <div class="form-group">
      <label for="map-select">Chọn Bản Đồ Chơi:</label>
      <select id="map-select">
        <option value="classic">🧱 Map 1: Cổ Điển (Đụng Tường Thua)</option>
        <option value="borderless">🌀 Map 2: Đi Xuyên Tường (Xuyên Map)</option>
        <option value="obstacles">🚧 Map 3: Chướng Ngại Vật Ngẫu Nhiên</option>
      </select>
    </div>

    <div class="form-group">
      <label for="speed-select">Tốc Độ Ban Đầu:</label>
      <select id="speed-select">
        <option value="150">Rùa Bò (Thong thả) 🐢</option>
        <option value="120" selected>Bình Thường (Chuẩn) 🐍</option>
        <option value="80">Tên Lửa (Siêu nhanh) ⚡</option>
      </select>
    </div>

    <button id="start-btn" class="btn-main">Bắt đầu chơi 🚀</button>

    <!-- BẢNG KỶ LỤC -->
    <div class="high-score-box">
      <h3>🏆 Kỷ Lục Cá Nhân</h3>
      <p id="high-score-display">Chưa có kỷ lục nào!</p>
    </div>

    <!-- THÔNG TIN CHỦ QUYỀN -->
    <div class="copyright-box">
      <p>👑 <strong>Chủ quyền dự án:</strong> Phát triển bởi Khoai-Lang-20</p>
      <p>📅 Phiên bản: v1.2 Pro Edition</p>
    </div>
  </div>

  <!-- MÀN HÌNH TRÒ CHƠI -->
  <div id="game-screen" class="container hidden">
    <div class="game-header">
      <button id="back-menu-btn" class="btn-secondary">⬅️ Menu</button>
      <div id="map-name-display" class="map-badge">🧱 Map Cổ Điển</div>
    </div>

    <div class="score-board">
      <span>Điểm: <strong id="score">0</strong></span>
      <span>Tốc độ: <strong id="speed-level">1.0</strong>x</span>
    </div>

    <!-- Canvas vẽ Game -->
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <!-- Nút điều khiển cảm ứng cho di động -->
    <div class="controls-dpad">
      <button id="btn-up" class="btn-arrow">⬆️</button>
      <div class="horizontal-btns">
        <button id="btn-left" class="btn-arrow">⬅️</button>
        <button id="btn-down" class="btn-arrow">⬇️</button>
        <button id="btn-right" class="btn-arrow">➡️</button>
      </div>
    </div>

    <!-- Message Thua/Thắng -->
    <div id="message-box" class="message hidden"></div>

    <button id="restart-btn" class="btn-main hidden">Chơi ván mới 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
