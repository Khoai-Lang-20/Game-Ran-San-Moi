<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Rắn Săn Mồi v1.0 - Cổ Điển</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🐍 Rắn Săn Mồi v1.0</h1>
    
    <div class="score-board">
      <span>Điểm số: <strong id="score">0</strong></span>
    </div>

    <!-- Màn hình game Canvas -->
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <p class="instruction">Dùng các phím **Mũi Tên** (trên máy tính) hoặc bấm nút bên dưới (trên điện thoại) để điều khiển rắn!</p>

    <!-- Nút điều khiển cho điện thoại -->
    <div class="controls-dpad">
      <button id="btn-up" class="btn-arrow">⬆️</button>
      <div class="horizontal-btns">
        <button id="btn-left" class="btn-arrow">⬅️</button>
        <button id="btn-down" class="btn-arrow">⬇️</button>
        <button id="btn-right" class="btn-arrow">➡️</button>
      </div>
    </div>

    <button id="restart-btn" class="btn-main">Chơi ván mới 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
